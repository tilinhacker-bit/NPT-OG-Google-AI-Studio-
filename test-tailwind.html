<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
        }
        .dark {
            --color-white: #1e293b;
            --color-slate-50: #0f172a;
            --color-slate-100: #334155;
            --color-slate-200: #475569;
            --color-slate-300: #64748b;
            --color-slate-400: #94a3b8;
            --color-slate-500: #cbd5e1;
            --color-slate-600: #e2e8f0;
            --color-slate-700: #f1f5f9;
            --color-slate-800: #f8fafc;
            --color-slate-900: #ffffff;
        }
    </style>
</head>
<body class="bg-white text-slate-800">
    Hello World
    <button onclick="document.documentElement.classList.toggle('dark')">Toggle</button>
</body>
</html>
